# 文件职责：生产环境 Compose 覆盖配置。
# 为 MySQL、Redis、uploads 和 .data 配置持久化卷，并通过 Nginx 网关暴露唯一外部入口。
# 注意：api 的 /metrics 只在 Compose 网络内可达，网关不代理该路径——指标不应对公网暴露。
name: nuxt-modern-starter-api-prod

services:
  mysql:
    container_name: nuxt-modern-starter-api-mysql
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    container_name: nuxt-modern-starter-api-redis
    volumes:
      - redis_data:/data

  gateway:
    image: nginx:alpine
    container_name: nuxt-modern-starter-api-gateway
    volumes:
      - ./nginx/gateway.docker.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_HOST_PORT:-2027}:2027"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    container_name: nuxt-modern-starter-api-app
    environment:
      APP_ENV: production
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "1"
      LOG_TO_FILE: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_TOKEN_BLACKLIST_ENABLED: ${AUTH_TOKEN_BLACKLIST_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.production}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.production}
      DB_USER: ${DB_USER:?Set DB_USER in .env.production}
      DB_PWD: ${DB_PWD:?Set DB_PWD in .env.production}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-10}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-900}
      REFRESH_TOKEN_RETENTION_DAYS: ${REFRESH_TOKEN_RETENTION_DAYS:-7}
      UPLOAD_TEMP_RETENTION_HOURS: ${UPLOAD_TEMP_RETENTION_HOURS:-24}
      CLEANUP_INTERVAL_MS: ${CLEANUP_INTERVAL_MS:-21600000}
    volumes:
      - app_uploads:/app/uploads
      - app_data:/app/.data

volumes:
  mysql_data:
  redis_data:
  app_uploads:
  app_data:
