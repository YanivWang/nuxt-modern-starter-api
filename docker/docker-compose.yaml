name: express-modern-starter-prod

services:
  mysql:
    container_name: express-modern-starter-mysql
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    container_name: express-modern-starter-redis
    volumes:
      - redis_data:/data

  gateway:
    image: nginx:alpine
    container_name: express-modern-starter-gateway
    volumes:
      - ./nginx/gateway.docker.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_HOST_PORT:-2026}:2026"
    depends_on:
      rest-api:
        condition: service_healthy
    restart: unless-stopped

  rest-api:
    container_name: express-modern-starter-rest-api
    environment:
      APP_ENV: production
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "1"
      LOG_TO_FILE: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_TOKEN_BLACKLIST_ENABLED: ${AUTH_TOKEN_BLACKLIST_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.production}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.production}
      DB_USER: ${DB_USER:?Set DB_USER in .env.production}
      DB_PWD: ${DB_PWD:?Set DB_PWD in .env.production}
    volumes:
      - app_uploads:/app/uploads
      - app_data:/app/.data

volumes:
  mysql_data:
  redis_data:
  app_uploads:
  app_data:
