# 文件职责：开发环境 Compose 覆盖配置。
# 暴露 MySQL/Redis/调试端口，绑定挂载源码，并通过 Nginx 网关提供与生产接近的入口。
name: nuxt-modern-starter-api-dev

services:
  mysql:
    container_name: nuxt-modern-starter-api-mysql-dev
    volumes:
      - mysql_dev_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    container_name: nuxt-modern-starter-api-redis-dev
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"

  gateway:
    image: nginx:alpine
    container_name: nuxt-modern-starter-api-gateway-dev
    volumes:
      - ./nginx/gateway.docker.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_HOST_PORT:-2027}:2027"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: nuxt-modern-starter-api-app-dev
    env_file:
      - ../.env.development
    environment:
      APP_ENV: development
      NODE_ENV: development
      HUSKY: "0"
      PORT: "3000"
      TRUST_PROXY: "1"
    ports:
      - "9229:9229"
    volumes:
      - ..:/app
      - app_node_modules:/app/node_modules
    command: ["sh", "-c", "CI=true pnpm install --frozen-lockfile && pnpm dev"]

volumes:
  mysql_dev_data:
  redis_dev_data:
  app_node_modules:
