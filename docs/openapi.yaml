openapi: 3.0.3
info:
  title: Express Modern Starter API
  version: 1.0.0
  description: 独立 Express API 服务脚手架，保留 auth、user、health、upload 和 large-upload 通用能力。
servers:
  - url: http://127.0.0.1:3000
    description: 本地 API 服务
  - url: http://127.0.0.1:2026
    description: Docker Nginx 网关
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MsgBody:
      type: object
      properties:
        code:
          type: integer
        msg:
          type: string
paths:
  /health:
    get:
      tags: [探针]
      responses:
        "200": { description: ok }
  /ready:
    get:
      tags: [探针]
      responses:
        "200": { description: ok }
  /api/register:
    post:
      tags: [认证]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 2, maxLength: 100 }
                password: { type: string, minLength: 6, maxLength: 100 }
      responses:
        "200": { description: 注册成功 }
  /api/login:
    post:
      tags: [认证]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200": { description: 登录成功，返回 token }
  /api/logout:
    post:
      tags: [认证]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 退出登录成功 }
  /api/me:
    get:
      tags: [当前用户]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 当前用户基础资料 }
  /api/me/profile:
    get:
      tags: [当前用户]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 当前用户扩展资料 }
    patch:
      tags: [当前用户]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 更新当前用户扩展资料 }
  /api/uploads:
    post:
      tags: [上传]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200": { description: 上传通用图片，返回 /uploads/common/... URL }
  /api/uploads/profiles:
    post:
      tags: [上传]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 上传用户头像/资料图 }
  /api/uploads/large/init:
    post:
      tags: [上传]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 创建大文件分片上传任务或秒传 }
  /api/uploads/large/{uploadId}/status:
    get:
      tags: [上传]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: 查询上传状态 }
  /api/uploads/large/{uploadId}/chunks/{chunkIndex}:
    put:
      tags: [上传]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: chunkIndex, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { name: X-Chunk-Md5, in: header, required: true, schema: { type: string } }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                chunk: { type: string, format: binary }
      responses:
        "200": { description: 分片已接收 }
  /api/uploads/large/{uploadId}/merge:
    post:
      tags: [上传]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: 合并完成 }
  /api/uploads/large/{uploadId}:
    delete:
      tags: [上传]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: 已取消 }
