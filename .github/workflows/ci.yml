# 文件职责：GitHub Actions 质量门禁。
# 在 MySQL/Redis services 就绪后运行 pnpm run check，覆盖类型、lint、格式、OpenAPI 同步、测试和构建。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password_change_me
          MYSQL_DATABASE: nuxt_modern_starter_api_test
          MYSQL_USER: app_user
          MYSQL_PASSWORD: app_password_123456
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password_change_me"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm run check
        env:
          APP_ENV: test
          NODE_ENV: test
          REDIS_URL: redis://127.0.0.1:6379
